          // MARK: - Generar programación

          struct GenerarView: View {
              @EnvironmentObject var store: Store
              @State private var semana = mondayOf(Date())
              @State private var seleccionId: UUID?
              @State private var confirmar = false
              @State private var mensaje: String?

              private var indice: Int? {
                  guard let id = seleccionId else { return nil }
                  return store.data.schedules.firstIndex(where: { $0.id == id })
              }

              private func existente(_ lunes: Date) -> Schedule? {
                  return store.data.schedules.first(where: { calendarioCO.isDate($0.weekStart, inSameDayAs: lunes) })
              }

              var body: some View {
                  Pagina("Generar programación semanal") {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 14) {
                              Tarjeta("Parámetros de la semana") {
                                  HStack(spacing: 16) {
                                      DatePicker("Lunes de la semana", selection: Binding(
                                          get: { semana },
                                          set: { nueva in
                                              semana = mondayOf(nueva)
                                              seleccionId = existente(semana)?.id
                                          }
                                      ), displayedComponents: .date)
                                      .frame(width: 330)
                                      TextField("Jornada", text: $store.data.settings.jornada)
                                          .frame(width: 160)
                                  }
                                  Text(etiquetaSemanaTexto)
                                      .foregroundColor(.secondary)
                                  Text("\(store.data.teachers.filter { $0.active }.count) docentes habilitados · \(store.data.zones.filter { $0.active }.count) zonas activas · \(novedades) novedades esta semana")
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                                  Button {
                                      generar()
                                  } label: {
                                      Label("Generar programación", systemImage: "wand.and.stars")
                                          .font(.title3)
                                          .padding(.horizontal, 8)
                                          .padding(.vertical, 3)
                                  }
                                  .buttonStyle(.borderedProminent)
                                  .controlSize(.large)
                              }

                              if let i = indice {
                                  let s = store.data.schedules[i]
                                  Tarjeta("Resumen de validación") {
                                      ListaHallazgos(items: validar(s, store.data))
                                  }
                                  Text(s.published ? "Programación publicada (no se puede modificar)." : "Borrador: puedes cambiar zonas y rondas antes de publicar.")
                                      .foregroundColor(s.published ? .green : .orange)
                                  ProgramacionTabla(s: $store.data.schedules[i], editable: !s.published)
                                  if !s.published {
                                      HStack {
                                          Button("Publicar programación") {
                                              let problemas = validar(s, store.data).filter { $0.nivel != .ok }
                                              if problemas.isEmpty { publicar(s.id) } else { confirmar = true }
                                          }
                                          .buttonStyle(.borderedProminent)
                                          Button("Descartar borrador", role: .destructive) {
                                              store.data.schedules.removeAll { $0.id == s.id }
                                              seleccionId = nil
                                          }
                                          Spacer()
                                      }
                                  }
                              }
                          }
                      }
                  }
                  .onAppear {
                      if let w = store.requestedWeek {
                          semana = mondayOf(w)
                          store.requestedWeek = nil
                      }
                      seleccionId = existente(semana)?.id
                  }
                  .alert("La programación tiene alertas", isPresented: $confirmar) {
                      Button("Publicar de todos modos") {
                          if let i = indice { publicar(store.data.schedules[i].id) }
                      }
                      Button("Revisar", role: .cancel) {}
                  } message: {
                      Text("Hay avisos o conflictos en el resumen de validación. Revísalos antes de publicar.")
                  }
                  .avisoTexto($mensaje)
              }

              private var etiquetaSemanaTexto: String {
                  return "Semana del \(fechaLarga(semana)) al \(fechaLarga(addDays(semana, 4)))"
              }

              private var novedades: Int {
                  var n = 0
                  for t in store.data.teachers where t.active {
                      for d in 0..<5 {
                          if isAbsent(t, on: addDays(semana, d)) { n += 1 }
                      }
                  }
                  return n
              }

              private func generar() {
                  let lunes = mondayOf(semana)
                  if let ex = existente(lunes) {
                      if ex.published {
                          mensaje = "Esa semana ya está publicada y no se modifica. Elige otro lunes."
                          seleccionId = ex.id
                          return
                      }
                      store.data.schedules.removeAll { $0.id == ex.id }
                  }
                  let nueva = generarSemana(store.data, weekStart: lunes, jornada: store.data.settings.jornada)
                  store.data.schedules.append(nueva)
                  seleccionId = nueva.id
              }

              private func publicar(_ id: UUID) {
                  if let i = store.data.schedules.firstIndex(where: { $0.id == id }) {
                      store.data.schedules[i].published = true
                  }
              }
          }

