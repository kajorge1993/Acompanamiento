name: Build Mac App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Crear proyecto
        run: |
          set -e
          mkdir -p proj/Sources
          cd proj
          cat > Package.swift <<'EOF_FILE'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "Acompanamiento",
              platforms: [.macOS(.v13)],
              targets: [
                  .executableTarget(name: "Acompanamiento", path: "Sources")
              ]
          )
          EOF_FILE
          cat > Sources/App.swift <<'EOF_FILE'
          import SwiftUI

          @main
          struct AcompanamientoApp: App {
              @StateObject private var store = Store()

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(store)
                          .frame(minWidth: 1050, minHeight: 680)
                  }
              }
          }
          EOF_FILE
          cat > Sources/Models.swift <<'EOF_FILE'
          import Foundation
          import SwiftUI
          import AppKit

          let diasNombre = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"]

          let zonasIniciales = [
              "Bloque Coordinación y Baños Mujeres",
              "Cancha Principal y Zona de Mesas",
              "Bloque Fotocopiadora y Baños Hombres",
              "Bloque Primaria y Tienda"
          ]

          let zonaHorariaBogota: TimeZone = TimeZone(identifier: "America/Bogota") ?? TimeZone.current

          let calendarioCO: Calendar = {
              var c = Calendar(identifier: .gregorian)
              c.firstWeekday = 2
              c.timeZone = zonaHorariaBogota
              c.locale = Locale(identifier: "es_CO")
              return c
          }()

          func formateador(_ patron: String) -> DateFormatter {
              let f = DateFormatter()
              f.locale = Locale(identifier: "es_CO")
              f.timeZone = zonaHorariaBogota
              f.dateFormat = patron
              return f
          }

          func fechaLarga(_ d: Date) -> String { formateador("d 'de' MMMM 'de' yyyy").string(from: d) }
          func fechaDia(_ d: Date) -> String { formateador("d 'de' MMMM").string(from: d) }
          func fechaCorta(_ d: Date) -> String { formateador("dd/MM/yyyy").string(from: d) }

          func mondayOf(_ d: Date) -> Date {
              let c = calendarCO
              let inicio = c.startOfDay(for: d)
              let wd = c.component(.weekday, from: inicio)
              let desplazamiento = (wd + 5) % 7
              return c.date(byAdding: .day, value: -desplazamiento, to: inicio) ?? inicio
          }

          func addDays(_ d: Date, _ n: Int) -> Date {
              return calendarCO.date(byAdding: .day, value: n, to: d) ?? d
          }

          struct IdRef: Identifiable {
              let id: UUID
          }

          struct Absence: Codable, Identifiable, Hashable {
              var id = UUID()
              var start: Date
              var end: Date
              var note: String = ""
          }

          struct Teacher: Codable, Identifiable, Hashable {
              var id = UUID()
              var name: String
              var day: Int
              var active: Bool = true
              var absences: [Absence] = []
          }

          struct Zone: Codable, Identifiable, Hashable {
              var id = UUID()
              var name: String
              var active: Bool = true
          }

          struct Assignment: Codable, Identifiable, Hashable {
              var id = UUID()
              var teacherId: UUID
              var day: Int
              var zoneId: UUID?
              var absent: Bool = false
          }

          struct Ronda: Codable, Hashable {
              var a: UUID? = nil
              var b: UUID? = nil
          }

          struct Schedule: Codable, Identifiable, Hashable {
              var id = UUID()
              var weekStart: Date
              var jornada: String
              var assignments: [Assignment]
              var rondas: [Ronda]
              var published: Bool = false
              var notes: String = ""
              var warnings: [String] = []

              func ronda(_ d: Int) -> Ronda {
                  return d >= 0 && d < rondas.count ? rondas[d] : Ronda()
              }
          }

          struct Settings: Codable {
              var institution = "Institución Educativa Técnico Industrial Pedro Antonio Molina (IETIPAM)"
              var sede = "Jorge Eliécer Gaitán"
              var jornada = "Mañana"
              var observation = "Todos los docentes del día correspondiente deberán acompañar el ingreso y la salida de los estudiantes, con el fin de hacer seguimiento al uniforme y la presentación personal de los estudiantes."
              var pin = ""
          }

          struct AppData: Codable {
              var teachers: [Teacher] = []
              var zones: [Zone] = zonasIniciales.map { Zone(name: $0) }
              var schedules: [Schedule] = []
              var settings = Settings()
          }

          func makeEncoder() -> JSONEncoder {
              let e = JSONEncoder()
              e.dateEncodingStrategy = .iso8601
              e.outputFormatting = [.prettyPrinted]
              return e
          }

          func makeDecoder() -> JSONDecoder {
              let d = JSONDecoder()
              d.dateDecodingStrategy = .iso8601
              return d
          }

          func normalizar(_ d: AppData) -> AppData {
              var x = d
              for i in x.schedules.indices {
                  while x.schedules[i].rondas.count < 5 {
                      x.schedules[i].rondas.append(Ronda())
                  }
              }
              return x
          }

          final class Store: ObservableObject {
              @Published var data: AppData {
                  didSet { guardar() }
              }
              @Published var unlocked = false
              @Published var requestedWeek: Date? = nil
              private let url: URL

              init() {
                  let fm = FileManager.default
                  let raiz = fm.urls(for: .applicationSupportDirectory, in: .userDomainMask).first
                      ?? URL(fileURLWithPath: NSTemporaryDirectory())
                  let carpeta = raiz.appendingPathComponent("Acompanamiento", isDirectory: true)
                  try? fm.createDirectory(at: carpeta, withIntermediateDirectories: true)
                  let archivo = carpeta.appendingPathComponent("datos.json")
                  url = archivo
                  if let crudo = try? Data(contentsOf: archivo),
                     let leido = try? makeDecoder().decode(AppData.self, from: crudo) {
                      data = normalizar(leido)
                  } else {
                      data = AppData()
                  }
              }

              private func guardar() {
                  do {
                      let crudo = try makeEncoder().encode(data)
                      try crudo.write(to: url, options: .atomic)
                  } catch {
                      print("No se pudo guardar: \(error)")
                  }
              }

              func exportarCopia(a destino: URL) throws {
                  try makeEncoder().encode(data).write(to: destino)
              }

              func restaurarCopia(de origen: URL) throws {
                  let crudo = try Data(contentsOf: origen)
                  data = normalizar(try makeDecoder().decode(AppData.self, from: crudo))
              }

              func nombreDocente(_ id: UUID?) -> String {
                  guard let id = id else { return "—" }
                  return data.teachers.first(where: { $0.id == id })?.name ?? "—"
              }

              func nombreZona(_ id: UUID?) -> String {
                  guard let id = id else { return "Sin zona" }
                  return data.zones.first(where: { $0.id == id })?.name ?? "Sin zona"
              }
          }

          func nombreDocente(_ id: UUID?, _ data: AppData) -> String {
              guard let id = id else { return "—" }
              return data.teachers.first(where: { $0.id == id })?.name ?? "—"
          }

          func nombreZona(_ id: UUID?, _ data: AppData) -> String {
              guard let id = id else { return "Sin zona" }
              return data.zones.first(where: { $0.id == id })?.name ?? "Sin zona"
          }

          func etiquetaSemana(_ s: Schedule) -> String {
              return "Semana del \(fechaDia(s.weekStart)) al \(fechaLarga(addDays(s.weekStart, 4)))"
          }
          EOF_FILE
          cat > Sources/Scheduler.swift <<'EOF_FILE'
          import Foundation

          // MARK: - Historial

          struct HistoryStats {
              var count = 0
              var zoneVisits: [UUID: [UUID: Int]] = [:]
              var zoneLast: [UUID: [UUID: Int]] = [:]
              var rondaCount: [UUID: Int] = [:]
              var rondaLast: [UUID: Int] = [:]
              var pairCount: [String: Int] = [:]
              var pairLast: [String: Int] = [:]
          }

          func pairKey(_ a: UUID, _ b: UUID) -> String {
              let x = a.uuidString
              let y = b.uuidString
              return x < y ? x + "|" + y : y + "|" + x
          }

          func buildHistory(_ schedules: [Schedule], before: Date?, excluding: UUID? = nil) -> HistoryStats {
              var h = HistoryStats()
              var lista: [Schedule] = []
              for s in schedules {
                  if !s.published { continue }
                  if let ex = excluding, s.id == ex { continue }
                  if let limite = before, s.weekStart >= limite { continue }
                  lista.append(s)
              }
              lista.sort { $0.weekStart < $1.weekStart }
              for (i, s) in lista.enumerated() {
                  h.count += 1
                  let pos = i + 1
                  for a in s.assignments {
                      if a.absent { continue }
                      guard let z = a.zoneId else { continue }
                      h.zoneVisits[a.teacherId, default: [:]][z, default: 0] += 1
                      h.zoneLast[a.teacherId, default: [:]][z] = pos
                  }
                  for r in s.rondas {
                      if let a = r.a {
                          h.rondaCount[a, default: 0] += 1
                          h.rondaLast[a] = pos
                      }
                      if let b = r.b {
                          h.rondaCount[b, default: 0] += 1
                          h.rondaLast[b] = pos
                      }
                      if let a = r.a, let b = r.b {
                          let k = pairKey(a, b)
                          h.pairCount[k, default: 0] += 1
                          h.pairLast[k] = pos
                      }
                  }
              }
              return h
          }

          func isAbsent(_ t: Teacher, on date: Date) -> Bool {
              let c = calendarCO
              let d = c.startOfDay(for: date)
              for a in t.absences {
                  if c.startOfDay(for: a.start) <= d && d <= c.startOfDay(for: a.end) { return true }
              }
              return false
          }

          // MARK: - Algoritmo húngaro (asignación de costo mínimo)

          func hungarian(_ a: [[Int]]) -> [Int] {
              let n = a.count
              if n == 0 { return [] }
              let m = a[0].count
              let INF = Int.max / 4
              var u = [Int](repeating: 0, count: n + 1)
              var v = [Int](repeating: 0, count: m + 1)
              var p = [Int](repeating: 0, count: m + 1)
              var way = [Int](repeating: 0, count: m + 1)
              for i in 1...n {
                  p[0] = i
                  var j0 = 0
                  var minv = [Int](repeating: INF, count: m + 1)
                  var used = [Bool](repeating: false, count: m + 1)
                  repeat {
                      used[j0] = true
                      let i0 = p[j0]
                      var delta = INF
                      var j1 = 0
                      for j in 1...m {
                          if !used[j] {
                              let cur = a[i0 - 1][j - 1] - u[i0] - v[j]
                              if cur < minv[j] {
                                  minv[j] = cur
                                  way[j] = j0
                              }
                              if minv[j] < delta {
                                  delta = minv[j]
                                  j1 = j
                              }
                          }
                      }
                      for j in 0...m {
                          if used[j] {
                              u[p[j]] += delta
                              v[j] -= delta
                          } else {
                              minv[j] -= delta
                          }
                      }
                      j0 = j1
                  } while p[j0] != 0
                  repeat {
                      let j1 = way[j0]
                      p[j0] = p[j1]
                      j0 = j1
                  } while j0 != 0
              }
              var ans = [Int](repeating: -1, count: n)
              for j in 1...m {
                  if p[j] != 0 { ans[p[j] - 1] = j - 1 }
              }
              return ans
          }

          // MARK: - Costos

          func costoZona(_ t: UUID, _ z: UUID, _ h: HistoryStats) -> Int {
              var c = (h.zoneVisits[t]?[z] ?? 0) * 1000
              if let last = h.zoneLast[t]?[z] {
                  let hace = h.count + 1 - last
                  c += max(0, 40 - hace) * 10
              }
              return c
          }

          func costoPareja(_ a: UUID, _ b: UUID, _ h: HistoryStats) -> Int {
              let k = pairKey(a, b)
              var c = (h.pairCount[k] ?? 0) * 800
              if let last = h.pairLast[k] {
                  let hace = h.count + 1 - last
                  if hace == 1 {
                      c += 50000
                  } else if hace <= 8 {
                      c += (9 - hace) * 100
                  }
              }
              return c
          }

          // MARK: - Ronda general (asignación conjunta de toda la semana)

          func asignarRondas(docentes: [Teacher], lunes: Date, hist: HistoryStats) -> (rondas: [Ronda], avisos: [String]) {
              var avisos: [String] = []
              var vacias: [Ronda] = []
              for _ in 0..<5 { vacias.append(Ronda()) }
              if docentes.count < 2 {
                  avisos.append("Ronda general: se necesitan al menos dos docentes habilitados.")
                  return (vacias, avisos)
              }
              let FORB = 1_000_000_000
              let copias = max(1, (10 + docentes.count - 1) / docentes.count)
              var columnas: [(Int, Int)] = []
              for c in 0..<copias {
                  for ti in 0..<docentes.count { columnas.append((ti, c)) }
              }
              var permitido: [[Bool]] = []
              for t in docentes {
                  var fila: [Bool] = []
                  for d in 0..<5 {
                      fila.append(t.day != d && !isAbsent(t, on: addDays(lunes, d)))
                  }
                  permitido.append(fila)
              }
              var costos: [[Int]] = []
              for d in 0..<5 {
                  for _ in 0..<2 {
                      var fila: [Int] = []
                      for (ti, c) in columnas {
                          if !permitido[ti][d] {
                              fila.append(FORB)
                          } else {
                              let t = docentes[ti]
                              var base = (hist.rondaCount[t.id] ?? 0) * 1000
                              if let last = hist.rondaLast[t.id] {
                                  base += max(0, 20 - (hist.count + 1 - last)) * 20
                              }
                              fila.append(base + c * 100000)
                          }
                      }
                      costos.append(fila)
                  }
              }
              let sol = hungarian(costos)
              var elegidos: [Int?] = []
              var hayHuecos = false
              for (i, j) in sol.enumerated() {
                  if j < 0 || costos[i][j] >= FORB {
                      elegidos.append(nil)
                      hayHuecos = true
                  } else {
                      elegidos.append(columnas[j].0)
                  }
              }
              var resultado = vacias
              if hayHuecos {
                  for d in 0..<5 {
                      let x = elegidos[d * 2]
                      let y = elegidos[d * 2 + 1]
                      resultado[d] = Ronda(a: x == nil ? nil : docentes[x!].id, b: y == nil ? nil : docentes[y!].id)
                      if x == nil || y == nil {
                          avisos.append("Ronda general del \(diasNombre[d].lowercased()): no hay suficientes docentes disponibles.")
                      }
                  }
                  return (resultado, avisos)
              }
              // Reacomodar los 10 elegidos en parejas por día para evitar parejas repetidas
              var disponibles: [Int] = []
              for e in elegidos { if let x = e { disponibles.append(x) } }
              var mejorCosto = Int.max
              var mejorArreglo: [(Int, Int)] = []
              var actual: [(Int, Int)] = []
              func dfs(_ d: Int, _ resto: [Int], _ costo: Int) {
                  if costo >= mejorCosto { return }
                  if d == 5 {
                      mejorCosto = costo
                      mejorArreglo = actual
                      return
                  }
                  for i in 0..<resto.count {
                      for j in (i + 1)..<resto.count {
                          let a = resto[i]
                          let b = resto[j]
                          if a == b || !permitido[a][d] || !permitido[b][d] { continue }
                          var sobra = resto
                          sobra.remove(at: j)
                          sobra.remove(at: i)
                          actual.append((a, b))
                          dfs(d + 1, sobra, costo + costoPareja(docentes[a].id, docentes[b].id, hist))
                          actual.removeLast()
                      }
                  }
              }
              dfs(0, disponibles, 0)
              if mejorArreglo.count == 5 {
                  for d in 0..<5 {
                      resultado[d] = Ronda(a: docentes[mejorArreglo[d].0].id, b: docentes[mejorArreglo[d].1].id)
                  }
              } else {
                  for d in 0..<5 {
                      resultado[d] = Ronda(a: docentes[elegidos[d * 2]!].id, b: docentes[elegidos[d * 2 + 1]!].id)
                  }
              }
              return (resultado, avisos)
          }

          // MARK: - Generación de la semana

          func generarSemana(_ data: AppData, weekStart: Date, jornada: String) -> Schedule {
              let lunes = mondayOf(weekStart)
              let hist = buildHistory(data.schedules, before: lunes)
              let zonas = data.zones.filter { $0.active }
              let docentes = data.teachers.filter { $0.active }
              var asignaciones: [Assignment] = []
              var avisos: [String] = []

              if zonas.isEmpty { avisos.append("No hay zonas activas: no se pueden asignar zonas.") }

              for d in 0..<5 {
                  let fecha = addDays(lunes, d)
                  let delDia = docentes.filter { $0.day == d }.sorted { $0.name < $1.name }
                  var ausentes: [Teacher] = []
                  var presentes: [Teacher] = []
                  for t in delDia {
                      if isAbsent(t, on: fecha) { ausentes.append(t) } else { presentes.append(t) }
                  }
                  for t in ausentes {
                      asignaciones.append(Assignment(teacherId: t.id, day: d, zoneId: nil, absent: true))
                  }
                  if !ausentes.isEmpty {
                      let nombres = ausentes.map { $0.name }.joined(separator: ", ")
                      avisos.append("\(diasNombre[d]): ausentes \(nombres). Su zona debe cubrirse manualmente.")
                  }
                  if zonas.isEmpty || presentes.isEmpty { continue }

                  let n = presentes.count
                  let k = zonas.count
                  var cupos: [Int] = []
                  if n >= k {
                      let base = n / k
                      let extra = n % k
                      let desfase = hist.count % k
                      for zi in 0..<k {
                          let orden = (zi - desfase + k) % k
                          let cantidad = base + (orden < extra ? 1 : 0)
                          for _ in 0..<cantidad { cupos.append(zi) }
                      }
                  } else {
                      cupos = Array(0..<k)
                  }
                  var costos: [[Int]] = []
                  for t in presentes {
                      costos.append(cupos.map { zi in costoZona(t.id, zonas[zi].id, hist) })
                  }
                  let sol = hungarian(costos)
                  for (i, t) in presentes.enumerated() {
                      let zi = cupos[sol[i]]
                      asignaciones.append(Assignment(teacherId: t.id, day: d, zoneId: zonas[zi].id, absent: false))
                  }
              }

              let r = asignarRondas(docentes: docentes, lunes: lunes, hist: hist)
              avisos.append(contentsOf: r.avisos)

              return Schedule(weekStart: lunes, jornada: jornada, assignments: asignaciones, rondas: r.rondas, warnings: avisos)
          }

          // MARK: - Validación

          enum Nivel { case ok, aviso, error }

          struct Hallazgo: Identifiable {
              let id = UUID()
              let nivel: Nivel
              let texto: String
          }

          func validar(_ s: Schedule, _ data: AppData) -> [Hallazgo] {
              var out: [Hallazgo] = []
              let hist = buildHistory(data.schedules, before: s.weekStart, excluding: s.id)
              let zonasActivas = data.zones.filter { $0.active }

              func docente(_ id: UUID?) -> Teacher? {
                  guard let id = id else { return nil }
                  return data.teachers.first(where: { $0.id == id })
              }
              func nombre(_ id: UUID?) -> String { return docente(id)?.name ?? "—" }
              func zona(_ id: UUID?) -> String { return nombreZona(id, data) }
              func agregar(_ n: Nivel, _ t: String) { out.append(Hallazgo(nivel: n, texto: t)) }

              for w in s.warnings { agregar(.aviso, w) }

              // 1. Día fijo
              var problemas = 0
              for a in s.assignments {
                  if let t = docente(a.teacherId), t.day != a.day {
                      problemas += 1
                      agregar(.error, "\(t.name) está programado el \(diasNombre[a.day]) pero su día fijo es el \(diasNombre[t.day]).")
                  }
              }
              if problemas == 0 { agregar(.ok, "Cada docente conserva su día fijo.") }

              // 2. Rotación de zonas
              problemas = 0
              for a in s.assignments {
                  if a.absent { continue }
                  guard let z = a.zoneId, let t = docente(a.teacherId), !zonasActivas.isEmpty else { continue }
                  let visitas = zonasActivas.map { hist.zoneVisits[t.id]?[$0.id] ?? 0 }
                  let minimo = visitas.min() ?? 0
                  let aqui = hist.zoneVisits[t.id]?[z] ?? 0
                  if aqui > minimo {
                      problemas += 1
                      agregar(.aviso, "\(t.name) repite «\(zona(z))» antes de recorrer todas las zonas.")
                  } else if let u = hist.zoneLast[t.id]?[z], hist.count + 1 - u == 1, zonasActivas.count > 1 {
                      problemas += 1
                      agregar(.aviso, "\(t.name) repite la misma zona de la semana anterior.")
                  }
              }
              if problemas == 0 { agregar(.ok, "La rotación de zonas es correcta.") }

              // 3. Asignaciones incompatibles
              problemas = 0
              var vistos = Set<String>()
              for a in s.assignments {
                  let k = a.teacherId.uuidString + "-\(a.day)"
                  if vistos.contains(k) {
                      problemas += 1
                      agregar(.error, "\(nombre(a.teacherId)) tiene dos zonas el mismo día.")
                  }
                  vistos.insert(k)
              }
              for d in 0..<5 {
                  let r = s.ronda(d)
                  var ids: [UUID] = []
                  if let a = r.a { ids.append(a) }
                  if let b = r.b { ids.append(b) }
                  if Set(ids).count != ids.count {
                      problemas += 1
                      agregar(.error, "El \(diasNombre[d].lowercased()) el mismo docente aparece dos veces en la ronda general.")
                  }
                  for id in ids {
                      if s.assignments.contains(where: { $0.day == d && $0.teacherId == id }) {
                          problemas += 1
                          agregar(.error, "\(nombre(id)) tiene zona y ronda general el \(diasNombre[d].lowercased()).")
                      }
                  }
              }
              if problemas == 0 { agregar(.ok, "No hay asignaciones simultáneas incompatibles.") }

              // 4. Dos docentes por día en la ronda general
              problemas = 0
              for d in 0..<5 {
                  let r = s.ronda(d)
                  if r.a == nil || r.b == nil {
                      problemas += 1
                      agregar(.error, "La ronda general del \(diasNombre[d].lowercased()) no tiene dos docentes.")
                  }
              }
              if problemas == 0 { agregar(.ok, "Cada día tiene exactamente dos docentes en la ronda general.") }

              // 5. Parejas repetidas
              problemas = 0
              for d in 0..<5 {
                  let r = s.ronda(d)
                  if let a = r.a, let b = r.b, let last = hist.pairLast[pairKey(a, b)] {
                      let hace = hist.count + 1 - last
                      if hace == 1 {
                          problemas += 1
                          agregar(.aviso, "\(nombre(a)) y \(nombre(b)) repiten pareja de la semana anterior.")
                      } else if hace <= 8 {
                          problemas += 1
                          agregar(.aviso, "\(nombre(a)) y \(nombre(b)) ya hicieron ronda juntos hace \(hace) semanas.")
                      }
                  }
              }
              if problemas == 0 { agregar(.ok, "Las parejas de ronda general no se repiten en el historial reciente.") }

              // 6. Ausencias y restricciones
              problemas = 0
              for a in s.assignments {
                  if let t = docente(a.teacherId), !a.absent, isAbsent(t, on: addDays(s.weekStart, a.day)) {
                      problemas += 1
                      agregar(.error, "\(t.name) tiene una novedad registrada el \(diasNombre[a.day].lowercased()) y aparece asignado.")
                  }
              }
              for d in 0..<5 {
                  let r = s.ronda(d)
                  for id in [r.a, r.b] {
                      if let t = docente(id), isAbsent(t, on: addDays(s.weekStart, d)) {
                          problemas += 1
                          agregar(.error, "\(t.name) tiene una novedad registrada el \(diasNombre[d].lowercased()) y está en la ronda general.")
                      } else if let t = docente(id), !t.active {
                          problemas += 1
                          agregar(.aviso, "\(t.name) está desactivado y aparece en la ronda general.")
                      }
                  }
              }
              if problemas == 0 { agregar(.ok, "Se respetaron las ausencias y novedades registradas.") }

              // 7. Equidad
              var cuenta: [UUID: Int] = hist.rondaCount
              for d in 0..<5 {
                  let r = s.ronda(d)
                  if let a = r.a { cuenta[a, default: 0] += 1 }
                  if let b = r.b { cuenta[b, default: 0] += 1 }
              }
              let activos = data.teachers.filter { $0.active }
              var equilibrado = true
              if activos.count > 1 {
                  let vals = activos.map { cuenta[$0.id] ?? 0 }
                  if let mx = vals.max(), let mn = vals.min(), mx - mn > 1 {
                      equilibrado = false
                      agregar(.aviso, "La ronda general está desigual: entre \(mn) y \(mx) participaciones por docente.")
                  }
              }
              if equilibrado { agregar(.ok, "La ronda general está distribuida de forma equitativa.") }

              // 8. Cobertura de zonas
              problemas = 0
              for d in 0..<5 {
                  let hay = data.teachers.contains(where: { $0.active && $0.day == d })
                  if !hay {
                      problemas += 1
                      agregar(.aviso, "No hay docentes con día fijo el \(diasNombre[d].lowercased()): las zonas quedan sin cobertura.")
                      continue
                  }
                  for z in zonasActivas {
                      let cubierta = s.assignments.contains(where: { $0.day == d && $0.zoneId == z.id && !$0.absent })
                      if !cubierta {
                          problemas += 1
                          agregar(.aviso, "\(diasNombre[d]): la zona «\(z.name)» no tiene docente.")
                      }
                  }
              }
              if problemas == 0 { agregar(.ok, "Todas las zonas activas tienen cobertura todos los días.") }

              return out
          }

          // MARK: - Pruebas automáticas (simulación de 8 semanas)

          func datosDePrueba(_ porDia: [Int], _ base: AppData) -> AppData {
              var d = base
              d.schedules = []
              d.teachers = []
              var n = 1
              for (dia, cantidad) in porDia.enumerated() {
                  for _ in 0..<cantidad {
                      d.teachers.append(Teacher(name: String(format: "Docente %02d", n), day: dia))
                      n += 1
                  }
              }
              return d
          }

          @MainActor
          func simularEscenario(_ titulo: String, _ entrada: AppData, semanas: Int = 8) -> [String] {
              var d = entrada
              d.schedules = []
              d.teachers = d.teachers.map { t in
                  var x = t
                  x.absences = []
                  return x
              }
              var rep: [String] = ["", "▶︎ \(titulo)"]
              let activos = d.teachers.filter { $0.active }
              let zonasActivas = d.zones.filter { $0.active }
              if activos.isEmpty || zonasActivas.isEmpty {
                  rep.append("❌ Faltan docentes o zonas activas para simular.")
                  return rep
              }
              let inicio = mondayOf(Date())
              for w in 0..<semanas {
                  var s = generarSemana(d, weekStart: addDays(inicio, 7 * w), jornada: d.settings.jornada)
                  s.published = true
                  d.schedules.append(s)
              }
              rep.append("Semanas simuladas: \(semanas)")

              var malDia = 0
              for s in d.schedules {
                  for a in s.assignments {
                      if let t = d.teachers.first(where: { $0.id == a.teacherId }), t.day != a.day { malDia += 1 }
                  }
              }
              rep.append(malDia == 0 ? "✅ Cada docente conservó su día fijo todas las semanas." : "❌ \(malDia) asignaciones cambiaron de día.")

              var repetidas = 0
              for t in activos {
                  var visitadas = Set<UUID>()
                  for s in d.schedules {
                      for a in s.assignments where a.teacherId == t.id && !a.absent {
                          guard let z = a.zoneId else { continue }
                          if visitadas.contains(z) && visitadas.count < zonasActivas.count { repetidas += 1 }
                          visitadas.insert(z)
                          if visitadas.count >= zonasActivas.count { visitadas.removeAll() }
                      }
                  }
              }
              rep.append(repetidas == 0 ? "✅ Las zonas rotaron sin repetirse antes de completar el ciclo." : "⚠️ \(repetidas) repeticiones de zona antes de completar el ciclo (posible por el número de docentes por día).")

              var rondaMal = 0
              for s in d.schedules {
                  for dd in 0..<5 {
                      let r = s.ronda(dd)
                      if r.a == nil || r.b == nil || r.a == r.b { rondaMal += 1 }
                  }
              }
              rep.append(rondaMal == 0 ? "✅ Cada día tuvo dos docentes distintos en la ronda general." : "❌ \(rondaMal) días sin dos docentes en la ronda general.")

              var consecutivas = 0
              var repetidasOcho = 0
              var ultimaVez: [String: Int] = [:]
              var previas = Set<String>()
              for (w, s) in d.schedules.enumerated() {
                  var actuales = Set<String>()
                  for dd in 0..<5 {
                      let r = s.ronda(dd)
                      if let a = r.a, let b = r.b { actuales.insert(pairKey(a, b)) }
                  }
                  consecutivas += actuales.intersection(previas).count
                  for k in actuales {
                      if let u = ultimaVez[k], w - u <= 8 { repetidasOcho += 1 }
                      ultimaVez[k] = w
                  }
                  previas = actuales
              }
              rep.append(consecutivas == 0 ? "✅ Ninguna pareja de ronda se repitió en semanas consecutivas." : "⚠️ \(consecutivas) parejas repetidas en semanas consecutivas.")
              rep.append(repetidasOcho == 0 ? "✅ No hubo parejas repetidas dentro de las 8 semanas." : "⚠️ \(repetidasOcho) repeticiones de pareja dentro de las \(semanas) semanas (inevitable con pocos docentes).")

              var cuenta: [UUID: Int] = [:]
              for s in d.schedules {
                  for dd in 0..<5 {
                      let r = s.ronda(dd)
                      if let a = r.a { cuenta[a, default: 0] += 1 }
                      if let b = r.b { cuenta[b, default: 0] += 1 }
                  }
              }
              let vals = activos.map { cuenta[$0.id] ?? 0 }
              if let mx = vals.max(), let mn = vals.min() {
                  rep.append(mx - mn <= 1 ? "✅ Ronda general equitativa: entre \(mn) y \(mx) participaciones por docente." : "⚠️ Ronda general desigual: entre \(mn) y \(mx) participaciones.")
              }

              var errores = 0
              for s in d.schedules {
                  errores += validar(s, d).filter { $0.nivel == .error }.count
              }
              rep.append(errores == 0 ? "✅ Sin asignaciones incompatibles ni reglas rotas." : "❌ \(errores) errores de validación.")

              if let ultima = d.schedules.last {
                  let temp = FileManager.default.temporaryDirectory
                  let pdf = temp.appendingPathComponent("prueba-\(UUID().uuidString).pdf")
                  let xlsx = temp.appendingPathComponent("prueba-\(UUID().uuidString).xlsx")
                  let okPDF = exportarPDF(VistaImprimible(s: ultima, data: d), a: pdf)
                  var okXLSX = false
                  do {
                      try escribirXLSX(filas: tablaCompleta(ultima, d), hoja: "Acompañamiento", destino: xlsx)
                      okXLSX = true
                  } catch {
                      okXLSX = false
                  }
                  let tamPDF = tamanoArchivo(pdf)
                  let tamXLSX = tamanoArchivo(xlsx)
                  rep.append(okPDF && tamPDF > 0 ? "✅ Exportación a PDF funciona." : "❌ Falló la exportación a PDF.")
                  rep.append(okXLSX && tamXLSX > 0 ? "✅ Exportación a Excel funciona." : "❌ Falló la exportación a Excel.")
                  try? FileManager.default.removeItem(at: pdf)
                  try? FileManager.default.removeItem(at: xlsx)
              }
              return rep
          }

          @MainActor
          func ejecutarPruebas(_ real: AppData) -> String {
              var lineas: [String] = ["PRUEBAS DE SIMULACIÓN (8 semanas consecutivas)"]
              lineas.append(contentsOf: simularEscenario("20 docentes, 4 por día (caso ideal)", datosDePrueba([4, 4, 4, 4, 4], real)))
              lineas.append(contentsOf: simularEscenario("20 docentes repartidos 6-5-4-3-2 (caso irregular)", datosDePrueba([6, 5, 4, 3, 2], real)))
              if real.teachers.contains(where: { $0.active }) {
                  lineas.append(contentsOf: simularEscenario("Tus docentes registrados", real))
              }
              lineas.append("")
              lineas.append("Nota: si una regla es imposible con el número de docentes de un día, la app la marca como aviso y propone la mejor distribución posible.")
              return lineas.joined(separator: "\n")
          }

          func tamanoArchivo(_ u: URL) -> Int {
              let attrs = try? FileManager.default.attributesOfItem(atPath: u.path)
              if let n = attrs?[.size] as? NSNumber { return n.intValue }
              return 0
          }
