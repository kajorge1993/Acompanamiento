                      get: { porBorrar != nil },
                      set: { if !$0 { porBorrar = nil } }
                  )) {
                      Button("Eliminar", role: .destructive) {
                          if let r = porBorrar {
                              store.data.teachers.removeAll { $0.id == r.id }
                          }
                          porBorrar = nil
                      }
                      Button("Cancelar", role: .cancel) { porBorrar = nil }
                  } message: {
                      Text("Sus asignaciones históricas se conservan, pero ya no aparecerá en nuevas semanas. Si solo se ausenta, mejor desactívalo.")
                  }
                  .avisoTexto($mensaje)
              }

              private func importar() {
                  pedirAbrir { u in
                      var texto: String? = try? String(contentsOf: u, encoding: .utf8)
                      if texto == nil { texto = try? String(contentsOf: u, encoding: .isoLatin1) }
                      guard let contenido = texto else {
                          mensaje = "No se pudo leer el archivo."
                          return
                      }
                      var nuevos = 0
                      var sinDia = 0
                      var primera = true
                      for crudo in contenido.components(separatedBy: .newlines) {
                          let linea = crudo.trimmingCharacters(in: .whitespaces)
                          if linea.isEmpty { continue }
                          let sep: Character = linea.contains(";") ? ";" : (linea.contains("\t") ? "\t" : ",")
                          let cols = linea.split(separator: sep, omittingEmptySubsequences: false).map {
                              String($0).trimmingCharacters(in: CharacterSet(charactersIn: " \""))
                          }
                          let nombre = cols.first ?? ""
                          if nombre.isEmpty { continue }
                          let dia: Int? = cols.count > 1 ? diaIndice(cols[1]) : nil
                          if primera {
                              primera = false
                              let bajo = nombre.lowercased()
                              if (bajo.contains("nombre") || bajo.contains("docente")) && dia == nil { continue }
                          }
                          if store.data.teachers.contains(where: { $0.name.lowercased() == nombre.lowercased() }) { continue }
                          if dia == nil { sinDia += 1 }
                          store.data.teachers.append(Teacher(name: nombre, day: dia ?? 0))
                          nuevos += 1
                      }
                      mensaje = "Se importaron \(nuevos) docentes." + (sinDia > 0 ? " \(sinDia) no traían día válido y quedaron en lunes: revísalos." : "")
                  }
              }

              private func exportar() {
                  pedirGuardar(nombre: "docentes.csv") { u in
                      var lineas = [csvLinea(["Nombre", "Día", "Activo"])]
                      for t in store.data.teachers {
                          lineas.append(csvLinea([t.name, diasNombre[t.day], t.active ? "Sí" : "No"]))
                      }
                      let texto = "\u{FEFF}" + lineas.joined(separator: "\r\n")
                      do {
                          try texto.write(to: u, atomically: true, encoding: .utf8)
                          mensaje = "Listado exportado."
                      } catch {
                          mensaje = "No se pudo guardar el archivo."
                      }
                  }
              }
          }

