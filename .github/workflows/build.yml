                              Tarjeta("Parejas que han hecho ronda") {
                                  let parejas = hist.pairCount.sorted { $0.value > $1.value }
                                  if parejas.isEmpty {
                                      Text("Todavía no hay parejas en el historial.")
                                  }
                                  ForEach(parejas, id: \.key) { p in
                                      let ids = p.key.split(separator: "|").compactMap { UUID(uuidString: String($0)) }
                                      if ids.count == 2 {
                                          Text("\(store.nombreDocente(ids[0])) y \(store.nombreDocente(ids[1])): \(p.value) \(p.value == 1 ? "vez" : "veces")")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // MARK: - Historial y estadísticas

          struct HistorialView: View {
              @EnvironmentObject var store: Store
              @State private var seleccionId: UUID?
              @State private var comparaA: UUID?
              @State private var comparaB: UUID?

              var body: some View {
                  let todas = store.data.schedules.sorted { $0.weekStart > $1.weekStart }
                  let publicadas = todas.filter { $0.published }
                  let hist = buildHistory(store.data.schedules, before: nil)
                  let zonas = store.data.zones
                  Pagina("Historial y estadísticas") {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 14) {
                              Tarjeta("Programaciones guardadas") {
                                  if todas.isEmpty { Text("Aún no hay programaciones.") }
                                  ForEach(todas) { s in
                                      Button {
                                          seleccionId = (seleccionId == s.id) ? nil : s.id
                                      } label: {
                                          HStack {
                                              Text(etiquetaSemana(s))
                                              Text(s.published ? "publicada" : "borrador").foregroundColor(s.published ? .green : .orange)
                                              Spacer()
                                              Image(systemName: seleccionId == s.id ? "chevron.up" : "chevron.down")
                                          }
                                          .contentShape(Rectangle())
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                              if let id = seleccionId, let i = store.data.schedules.firstIndex(where: { $0.id == id }) {
                                  ProgramacionTabla(s: $store.data.schedules[i], editable: false)
                              }

                              Tarjeta("Estadísticas por docente (semanas publicadas: \(publicadas.count))") {
                                  HStack {
                                      Text("Docente").bold().frame(width: 220, alignment: .leading)
                                      Text("Día").bold().frame(width: 90, alignment: .leading)
                                      ForEach(Array(zonas.enumerated()), id: \.element.id) { idx, _ in
                                          Text("Z\(idx + 1)").bold().frame(width: 40)
                                      }
                                      Text("Rondas").bold().frame(width: 60)
                                  }
                                  ForEach(store.data.teachers) { t in
                                      HStack {
                                          Text(t.name).frame(width: 220, alignment: .leading)
                                          Text(diasNombre[t.day]).frame(width: 90, alignment: .leading)
                                          ForEach(zonas) { z in
                                              Text("\(hist.zoneVisits[t.id]?[z.id] ?? 0)").frame(width: 40)
                                          }
                                          Text("\(hist.rondaCount[t.id] ?? 0)").frame(width: 60)
                                      }
                                  }
                                  Text(zonas.enumerated().map { "Z\($0.offset + 1) = \($0.element.name)" }.joined(separator: " · "))
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                              }

                              Tarjeta("Desequilibrios y repeticiones") {
                                  ListaHallazgos(items: desequilibrios(hist))
                              }

                              Tarjeta("Comparar dos semanas") {
                                  HStack {
                                      Picker("Semana A", selection: $comparaA) {
                                          Text("—").tag(UUID?.none)
                                          ForEach(todas) { s in Text(fechaCorta(s.weekStart)).tag(Optional(s.id)) }
                                      }
                                      Picker("Semana B", selection: $comparaB) {
                                          Text("—").tag(UUID?.none)
                                          ForEach(todas) { s in Text(fechaCorta(s.weekStart)).tag(Optional(s.id)) }
                                      }
                                  }
                                  if let a = todas.first(where: { $0.id == comparaA }), let b = todas.first(where: { $0.id == comparaB }) {
                                      ForEach(store.data.teachers) { t in
                                          let za = a.assignments.first(where: { $0.teacherId == t.id })
                                          let zb = b.assignments.first(where: { $0.teacherId == t.id })
                                          HStack {
                                              Text(t.name).frame(width: 220, alignment: .leading)
                                              Text(za == nil ? "—" : store.nombreZona(za?.zoneId)).frame(width: 260, alignment: .leading)
                                              Text(zb == nil ? "—" : store.nombreZona(zb?.zoneId)).frame(width: 260, alignment: .leading)
                                              if let x = za, let y = zb, x.zoneId == y.zoneId {
                                                  Text("repite").foregroundColor(.orange)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private func desequilibrios(_ hist: HistoryStats) -> [Hallazgo] {
                  var out: [Hallazgo] = []
                  let activos = store.data.teachers.filter { $0.active }
                  if activos.count > 1 {
                      let vals = activos.map { hist.rondaCount[$0.id] ?? 0 }
                      if let mx = vals.max(), let mn = vals.min(), mx - mn > 1 {
                          out.append(Hallazgo(nivel: .aviso, texto: "La ronda general está desigual: entre \(mn) y \(mx) participaciones por docente."))
                      }
                  }
                  for t in activos {
                      let vis = store.data.zones.filter { $0.active }.map { hist.zoneVisits[t.id]?[$0.id] ?? 0 }
                      if let mx = vis.max(), let mn = vis.min(), mx - mn > 1 {
                          out.append(Hallazgo(nivel: .aviso, texto: "\(t.name) tiene zonas muy desiguales (entre \(mn) y \(mx) veces)."))
                      }
                  }
                  let repetidas = hist.pairCount.filter { $0.value > 2 }.count
                  if repetidas > 0 {
                      out.append(Hallazgo(nivel: .aviso, texto: "\(repetidas) parejas de ronda se han repetido más de dos veces."))
                  }
                  if out.isEmpty { out.append(Hallazgo(nivel: .ok, texto: "No se detectan desequilibrios ni repeticiones relevantes.")) }
                  return out
              }
          }

          // MARK: - Exportar e imprimir

          @MainActor
          struct ExportarView: View {
              @EnvironmentObject var store: Store
              @State private var seleccionId: UUID?
              @State private var mensaje: String?

              private var actual: Schedule? {
                  let todas = store.data.schedules.sorted { $0.weekStart > $1.weekStart }
                  if let id = seleccionId, let s = todas.first(where: { $0.id == id }) { return s }
                  return todas.first
              }

              var body: some View {
                  let todas = store.data.schedules.sorted { $0.weekStart > $1.weekStart }
                  Pagina("Exportar e imprimir") {
                      if todas.isEmpty {
                          Text("Primero genera una programación en «Generar programación».")
                      } else {
                          HStack {
                              Picker("Semana", selection: Binding(
                                  get: { actual?.id },
                                  set: { seleccionId = $0 }
                              )) {
                                  ForEach(todas) { s in
                                      Text(etiquetaSemana(s) + (s.published ? "" : " (borrador)")).tag(Optional(s.id))
                                  }
                              }
                              .frame(width: 520)
                              Spacer()
                          }
                          HStack {
                              Button("Descargar PDF") { guardarPDF() }
                              Button("Descargar Excel (.xlsx)") { guardarExcel() }
                              Button("Descargar CSV") { guardarCSV() }
                              Button("Imprimir") { if let s = actual { imprimirSemana(s, store.data) } }
                              Button("Copiar tabla") {
                                  if let s = actual {
                                      copiarTabla(s, store.data)
                                      mensaje = "Tabla copiada. Pégala en WhatsApp, correo o Word."
                                  }
                              }
                              Spacer()
                          }
                          ScrollView {
                              if let s = actual {
                                  VistaImprimible(s: s, data: store.data)
                                      .cornerRadius(6)
                                      .shadow(radius: 2)
                              }
                          }
                      }
                  }
                  .avisoTexto($mensaje)
              }

              private func guardarPDF() {
                  guard let s = actual else { return }
                  pedirGuardar(nombre: nombreArchivoBase(s) + ".pdf") { u in
                      mensaje = exportarPDF(VistaImprimible(s: s, data: store.data), a: u) ? "PDF guardado." : "No se pudo crear el PDF."
                  }
              }

              private func guardarExcel() {
                  guard let s = actual else { return }
                  pedirGuardar(nombre: nombreArchivoBase(s) + ".xlsx") { u in
                      do {
                          try escribirXLSX(filas: tablaCompleta(s, store.data), hoja: "Acompañamiento", destino: u)
                          mensaje = "Excel guardado."
                      } catch {
                          mensaje = "No se pudo crear el Excel. Prueba con CSV."
                      }
                  }
              }

              private func guardarCSV() {
                  guard let s = actual else { return }
                  pedirGuardar(nombre: nombreArchivoBase(s) + ".csv") { u in
                      do {
                          try csvTexto(s, store.data).write(to: u, atomically: true, encoding: .utf8)
                          mensaje = "CSV guardado."
                      } catch {
                          mensaje = "No se pudo guardar el CSV."
                      }
                  }
              }
          }

          // MARK: - Configuración

          @MainActor
          struct ConfigView: View {
              @EnvironmentObject var store: Store
              @State private var mensaje: String?
              @State private var reporte: String?
              @State private var confirmarBorrado = false

              var body: some View {
                  Pagina("Configuración") {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 14) {
                              Tarjeta("Información institucional") {
                                  TextField("Institución", text: $store.data.settings.institution)
                                  TextField("Sede", text: $store.data.settings.sede)
                                  TextField("Jornada", text: $store.data.settings.jornada)
                                  Text("Observación institucional").font(.caption).foregroundColor(.secondary)
                                  TextEditor(text: $store.data.settings.observation)
                                      .frame(height: 70)
                              }
                              Tarjeta("Protección de administración") {
                                  SecureField("PIN (déjalo vacío para no usar PIN)", text: $store.data.settings.pin)
                                      .frame(width: 320)
                                  Text("Con PIN, las secciones de docentes, zonas, generación y configuración piden clave al abrir la app.")
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                              }
                              Tarjeta("Copia de seguridad") {
                                  HStack {
                                      Button("Guardar copia…") {
                                          pedirGuardar(nombre: "copia-acompanamiento.json") { u in
                                              do {
                                                  try store.exportarCopia(a: u)
                                                  mensaje = "Copia guardada."
                                              } catch {
                                                  mensaje = "No se pudo guardar la copia."
                                              }
                                          }
                                      }
                                      Button("Restaurar copia…") {
                                          pedirAbrir { u in
                                              do {
                                                  try store.restaurarCopia(de: u)
                                                  mensaje = "Copia restaurada."
                                              } catch {
                                                  mensaje = "El archivo no es una copia válida."
                                              }
                                          }
                                      }
                                      Button("Borrar todas las programaciones", role: .destructive) { confirmarBorrado = true }
                                  }
                                  Text("Los datos se guardan automáticamente en este Mac, en la carpeta Application Support/Acompanamiento.")
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                              }
                              Tarjeta("Pruebas del algoritmo") {
                                  Text("Simula 8 semanas consecutivas y verifica días fijos, rotación, ronda general, parejas y exportaciones.")
                                  Button("Ejecutar pruebas de 8 semanas") {
                                      reporte = ejecutarPruebas(store.data)
                                  }
                              }
                          }
                      }
                  }
                  .sheet(isPresented: Binding(get: { reporte != nil }, set: { if !$0 { reporte = nil } })) {
                      VStack(alignment: .leading, spacing: 10) {
                          ScrollView {
                              Text(reporte ?? "")
                                  .font(.system(.body, design: .monospaced))
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  .textSelection(.enabled)
                          }
                          HStack {
                              Spacer()
                              Button("Cerrar") { reporte = nil }
                          }
                      }
                      .padding(20)
                      .frame(width: 760, height: 560)
                  }
                  .alert("¿Borrar todas las programaciones?", isPresented: $confirmarBorrado) {
                      Button("Borrar", role: .destructive) { store.data.schedules = [] }
                      Button("Cancelar", role: .cancel) {}
                  } message: {
                      Text("Se pierde el historial de rotación. Los docentes y zonas se conservan.")
                  }
                  .avisoTexto($mensaje)
              }
          }
          EOF_FILE

      - name: Compilar y empaquetar la app
        working-directory: proj
        run: |
          set -e
          if swift build -c release --arch arm64 --arch x86_64; then
            BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          else
            swift build -c release
            BIN=$(swift build -c release --show-bin-path)
          fi
          APP="Acompanamiento.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN/Acompanamiento" "$APP/Contents/MacOS/Acompanamiento"
          cat > "$APP/Contents/Info.plist" <<'EOF_PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>Acompanamiento</string>
              <key>CFBundleIdentifier</key><string>co.ietipam.acompanamiento</string>
              <key>CFBundleName</key><string>Acompañamiento</string>
              <key>CFBundleDisplayName</key><string>Acompañamiento Docente</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSMinimumSystemVersion</key><string>13.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          EOF_PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Acompanamiento.zip
          ls -la Acompanamiento.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Acompanamiento-Mac
          path: proj/Acompanamiento.zip
