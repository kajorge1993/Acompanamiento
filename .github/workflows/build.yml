          // MARK: - Generar programación

          struct GenerarView: View {
              @EnvironmentObject var store: Store
              @State private var semana = mondayOf(Date())
              @State private var seleccionId: UUID?
              @State private var confirmar = false
              @State private var mensaje: String?

              private var indice: Int? {
                  guard let id = seleccionId else { return nil }
                  return store.data.schedules.firstIndex(where: { $0.id == id })
              }

              private func existente(_ lunes: Date) -> Schedule? {
                  return store.data.schedules.first(where: { calendarCO.isDate($0.weekStart, inSameDayAs: lunes) })
              }

              var body: some View {
                  Pagina("Generar programación semanal") {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 14) {
                              Tarjeta("Parámetros de la semana") {
                                  HStack(spacing: 16) {
                                      DatePicker("Lunes de la semana", selection: Binding(
                                          get: { semana },
                                          set: { nueva in
                                              semana = mondayOf(nueva)
                                              seleccionId = existente(semana)?.id
                                          }
                                      ), displayedComponents: .date)
                                      .frame(width: 330)
                                      TextField("Jornada", text: $store.data.settings.jornada)
                                          .frame(width: 160)
                                  }
                                  Text(etiquetaSemanaTexto)
                                      .foregroundColor(.secondary)
                                  Text("\(store.data.teachers.filter { $0.active }.count) docentes habilitados · \(store.data.zones.filter { $0.active }.count) zonas activas · \(novedades) novedades esta semana · \(diasLibres) días sin acompañamiento o sin ronda")
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                                  Button {
                                      generar()
                                  } label: {
                                      Label("Generar programación", systemImage: "wand.and.stars")
                                          .font(.title3)
                                          .padding(.horizontal, 8)
                                          .padding(.vertical, 3)
                                  }
                                  .buttonStyle(.borderedProminent)
                                  .controlSize(.large)
                              }

                              if let i = indice {
                                  let s = store.data.schedules[i]
                                  Tarjeta("Resumen de validación") {
                                      ListaHallazgos(items: validar(s, store.data))
                                  }
                                  if s.published {
                                      HStack {
                                          Text("Programación publicada.").foregroundColor(.green)
                                          Button("Reabrir como borrador") {
                                              store.data.schedules[i].published = false
                                          }
                                          Text("Úsalo solo si necesitas corregirla; después vuelve a publicarla.")
                                              .font(.caption)
                                              .foregroundColor(.secondary)
                                      }
                                  } else {
                                      Text("Borrador: puedes cambiar zonas, rondas y el estado de cada día antes de publicar.")
                                          .foregroundColor(.orange)
                                      TextField("Observaciones de esta semana (opcional)", text: $store.data.schedules[i].notes)
                                  }
                                  ProgramacionTabla(s: $store.data.schedules[i], editable: !s.published)
                                  if !s.published {
                                      HStack {
                                          Button("Publicar programación") {
                                              let problemas = validar(s, store.data).filter { $0.nivel == .aviso || $0.nivel == .error }
                                              if problemas.isEmpty { publicar(s.id) } else { confirmar = true }
                                          }
                                          .buttonStyle(.borderedProminent)
                                          Button("Descartar borrador", role: .destructive) {
                                              store.data.schedules.removeAll { $0.id == s.id }
                                              seleccionId = nil
                                          }
                                          Spacer()
                                      }
                                  }
                              }
                          }
                      }
                  }
                  .onAppear {
                      if let w = store.requestedWeek {
                          semana = mondayOf(w)
                          store.requestedWeek = nil
                      }
                      seleccionId = existente(semana)?.id
                  }
                  .alert("La programación tiene alertas", isPresented: $confirmar) {
                      Button("Publicar de todos modos") {
                          if let i = indice { publicar(store.data.schedules[i].id) }
                      }
                      Button("Revisar", role: .cancel) {}
                  } message: {
                      Text("Hay avisos o conflictos en el resumen de validación. Revísalos antes de publicar.")
                  }
                  .avisoTexto($mensaje)
              }

              private var etiquetaSemanaTexto: String {
                  return "Semana del \(fechaLarga(semana)) al \(fechaLarga(addDays(semana, 4)))"
              }

              private var novedades: Int {
                  var n = 0
                  for t in store.data.teachers where t.active {
                      for d in 0..<5 {
                          if isAbsent(t, on: addDays(semana, d)) { n += 1 }
                      }
                  }
                  return n
              }

              private var diasLibres: Int {
                  let es = estadosDeSemana(store.data, mondayOf(semana))
                  return es.estado.filter { $0 != 0 }.count
              }

              private func generar() {
                  let lunes = mondayOf(semana)
                  if let ex = existente(lunes) {
                      if ex.published {
                          mensaje = "Esa semana ya está publicada. Si necesitas corregirla, ábrela y toca «Reabrir como borrador»."
                          seleccionId = ex.id
                          return
                      }
                      store.data.schedules.removeAll { $0.id == ex.id }
                  }
                  let nueva = generarSemana(store.data, weekStart: lunes, jornada: store.data.settings.jornada)
                  store.data.schedules.append(nueva)
                  seleccionId = nueva.id
              }

              private func publicar(_ id: UUID) {
                  if let i = store.data.schedules.firstIndex(where: { $0.id == id }) {
                      store.data.schedules[i].published = true
                  }
              }
          }

          // MARK: - Festivos y días sin clase

          struct FestivosView: View {
              @EnvironmentObject var store: Store
              @State private var anio = Calendar.current.component(.year, from: Date())
              @State private var desde = Date()
              @State private var hasta = Date()
              @State private var motivo = ""
              @State private var alcance = 0
              @State private var mensaje: String?

              var body: some View {
                  Pagina("Festivos y días sin clase") {
                      Tarjeta("Agregar días") {
                          HStack {
                              DatePicker("Desde", selection: $desde, displayedComponents: .date)
                              DatePicker("Hasta", selection: $hasta, displayedComponents: .date)
                          }
                          HStack {
                              TextField("Motivo (festivo, sin clases, jornada pedagógica…)", text: $motivo)
                              Picker("", selection: $alcance) {
                                  Text("Todo el día").tag(0)
                                  Text("Solo sin ronda general").tag(1)
                              }
                              .labelsHidden()
                              .frame(width: 220)
                              Button("Agregar") { agregar() }
                          }
                          HStack {
                              Stepper("Año \(String(anio))", value: $anio, in: 2024...2040)
                                  .frame(width: 160)
                              Button("Cargar festivos de Colombia \(String(anio))") { cargarFestivos() }
                          }
                          Text("«Todo el día» quita zonas y ronda general ese día y no cuenta para la rotación. «Solo sin ronda general» deja las zonas y suprime la ronda. Los festivos se calculan con la ley colombiana (lunes festivos y Semana Santa); ajusta si tu institución usa otro calendario.")
                              .font(.caption)
                              .foregroundColor(.secondary)
                      }
                      List {
                          ForEach($store.data.freeDays) { $f in
                              HStack {
                                  DatePicker("", selection: $f.date, displayedComponents: .date)
                                      .labelsHidden()
                                      .frame(width: 140)
                                  Text(diaSemana(f.date)).frame(width: 90, alignment: .leading)
                                  TextField("Motivo", text: $f.reason)
                                  Picker("", selection: $f.scope) {
                                      Text("Todo el día").tag(0)
                                      Text("Solo sin ronda general").tag(1)
                                  }
                                  .labelsHidden()
                                  .frame(width: 210)
                                  Button {
                                      store.data.freeDays.removeAll { $0.id == f.id }
                                  } label: {
                                      Image(systemName: "trash")
                                  }
                              }
                          }
                      }
                  }
                  .avisoTexto($mensaje)
              }

              private func diaSemana(_ d: Date) -> String {
                  return formateador("EEEE").string(from: d).capitalized
              }

              private func agregar() {
                  var dia = calendarCO.startOfDay(for: desde)
                  let fin = calendarCO.startOfDay(for: max(hasta, desde))
                  var n = 0
                  var guardia = 0
                  while dia <= fin && guardia < 400 {
                      let wd = calendarCO.component(.weekday, from: dia)
                      let actual = dia
                      let existe = store.data.freeDays.contains(where: { calendarCO.isDate($0.date, inSameDayAs: actual) })
                      if wd >= 2 && wd <= 6 && !existe {
                          store.data.freeDays.append(FreeDay(date: dia, reason: motivo.isEmpty ? "Sin clases" : motivo, scope: alcance))
                          n += 1
                      }
                      dia = addDays(dia, 1)
                      guardia += 1
                  }
                  store.data.freeDays.sort { $0.date < $1.date }
                  mensaje = n == 0 ? "No se agregó ningún día (ya estaban o eran fin de semana)." : "Se agregaron \(n) días."
              }

              private func cargarFestivos() {
                  var n = 0
                  for f in festivosColombia(anio) {
                      let wd = calendarCO.component(.weekday, from: f.date)
                      let existe = store.data.freeDays.contains(where: { calendarCO.isDate($0.date, inSameDayAs: f.date) })
                      if wd >= 2 && wd <= 6 && !existe {
                          store.data.freeDays.append(f)
                          n += 1
                      }
                  }
                  store.data.freeDays.sort { $0.date < $1.date }
                  mensaje = "Se cargaron \(n) festivos de \(String(anio)). Los festivos que caen en fin de semana no se incluyen."
              }
          }

