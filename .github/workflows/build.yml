          func diaIndice(_ texto: String) -> Int? {
              let t = texto.lowercased()
                  .folding(options: .diacriticInsensitive, locale: nil)
                  .trimmingCharacters(in: .whitespaces)
              switch t {
              case "lunes", "1": return 0
              case "martes", "2": return 1
              case "miercoles", "3": return 2
              case "jueves", "4": return 3
              case "viernes", "5": return 4
              default: return nil
              }
          }

