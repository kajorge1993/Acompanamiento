          import Foundation
          import SwiftUI
          import AppKit
          import PDFKit

          // MARK: - Tabla de texto

          func tablaTexto(_ s: Schedule, _ data: AppData) -> [[String]] {
              var filas: [[String]] = [["Nombre del docente", "Día de la semana", "Zona asignada"]]
              for d in 0..<5 {
                  let etiqueta = "\(diasNombre[d]) \(fechaDia(addDays(s.weekStart, d)))"
                  for a in s.assignments where a.day == d {
                      filas.append([nombreDocente(a.teacherId, data), etiqueta, a.absent ? "Ausente (sin zona)" : nombreZona(a.zoneId, data)])
                  }
                  let r = s.ronda(d)
                  filas.append([nombreDocente(r.a, data), etiqueta, "Ronda general"])
                  filas.append([nombreDocente(r.b, data), etiqueta, "Ronda general"])
              }
              return filas
          }

          func tablaCompleta(_ s: Schedule, _ data: AppData) -> [[String]] {
              var filas: [[String]] = []
              filas.append([data.settings.institution])
              filas.append(["Sede: \(data.settings.sede)", "Jornada: \(s.jornada)"])
              filas.append(["Semana del \(fechaLarga(s.weekStart)) al \(fechaLarga(addDays(s.weekStart, 4)))"])
              filas.append([""])
              filas.append(contentsOf: tablaTexto(s, data))
              filas.append([""])
              filas.append(["Observaciones: " + data.settings.observation])
              return filas
          }

          func csvLinea(_ cols: [String]) -> String {
              return cols.map { "\"" + $0.replacingOccurrences(of: "\"", with: "\"\"") + "\"" }.joined(separator: ";")
          }

          func csvTexto(_ s: Schedule, _ data: AppData) -> String {
              let lineas = tablaCompleta(s, data).map { csvLinea($0) }
              return "\u{FEFF}" + lineas.joined(separator: "\r\n")
          }

          func nombreArchivoBase(_ s: Schedule) -> String {
              return "Acompanamiento_" + formateador("yyyy-MM-dd").string(from: s.weekStart)
          }

          // MARK: - Excel (.xlsx) sin librerías externas

          func escaparXML(_ s: String) -> String {
              var r = s.replacingOccurrences(of: "&", with: "&amp;")
              r = r.replacingOccurrences(of: "<", with: "&lt;")
              r = r.replacingOccurrences(of: ">", with: "&gt;")
              r = r.replacingOccurrences(of: "\"", with: "&quot;")
              return r
          }

          func letraColumna(_ i: Int) -> String {
              let letras = Array("ABCDEFGHIJKLMNOPQRSTUVWXYZ")
              return String(letras[min(max(i, 0), 25)])
          }

          func escribirXLSX(filas: [[String]], hoja: String, destino: URL) throws {
              let fm = FileManager.default
              let tmp = fm.temporaryDirectory.appendingPathComponent("xlsx-" + UUID().uuidString)
              try fm.createDirectory(at: tmp.appendingPathComponent("_rels"), withIntermediateDirectories: true)
              try fm.createDirectory(at: tmp.appendingPathComponent("xl/_rels"), withIntermediateDirectories: true)
              try fm.createDirectory(at: tmp.appendingPathComponent("xl/worksheets"), withIntermediateDirectories: true)

              let cabecera = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n"
              let tipos = cabecera + "<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">"
                  + "<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>"
                  + "<Default Extension=\"xml\" ContentType=\"application/xml\"/>"
                  + "<Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/>"
                  + "<Override PartName=\"/xl/worksheets/sheet1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>"
                  + "</Types>"
              let rels = cabecera + "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">"
                  + "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/>"
                  + "</Relationships>"
              let libro = cabecera + "<workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">"
                  + "<sheets><sheet name=\"" + escaparXML(String(hoja.prefix(30))) + "\" sheetId=\"1\" r:id=\"rId1\"/></sheets></workbook>"
              let relsLibro = cabecera + "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">"
                  + "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet1.xml\"/>"
                  + "</Relationships>"

              var datos = ""
              for (i, fila) in filas.enumerated() {
                  datos += "<row r=\"\(i + 1)\">"
                  for (j, celda) in fila.enumerated() {
                      datos += "<c r=\"\(letraColumna(j))\(i + 1)\" t=\"inlineStr\"><is><t>" + escaparXML(celda) + "</t></is></c>"
                  }
                  datos += "</row>"
              }
              let hojaXML = cabecera + "<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">"
                  + "<cols><col min=\"1\" max=\"1\" width=\"44\" customWidth=\"1\"/><col min=\"2\" max=\"2\" width=\"30\" customWidth=\"1\"/><col min=\"3\" max=\"3\" width=\"40\" customWidth=\"1\"/></cols>"
                  + "<sheetData>" + datos + "</sheetData></worksheet>"

              try tipos.write(to: tmp.appendingPathComponent("[Content_Types].xml"), atomically: true, encoding: .utf8)
              try rels.write(to: tmp.appendingPathComponent("_rels/.rels"), atomically: true, encoding: .utf8)
              try libro.write(to: tmp.appendingPathComponent("xl/workbook.xml"), atomically: true, encoding: .utf8)
              try relsLibro.write(to: tmp.appendingPathComponent("xl/_rels/workbook.xml.rels"), atomically: true, encoding: .utf8)
              try hojaXML.write(to: tmp.appendingPathComponent("xl/worksheets/sheet1.xml"), atomically: true, encoding: .utf8)

              if fm.fileExists(atPath: destino.path) { try fm.removeItem(at: destino) }
              let p = Process()
              p.executableURL = URL(fileURLWithPath: "/usr/bin/ditto")
              p.arguments = ["-c", "-k", "--norsrc", tmp.path, destino.path]
              try p.run()
              p.waitUntilExit()
              try? fm.removeItem(at: tmp)
              if p.terminationStatus != 0 {
                  throw NSError(domain: "xlsx", code: Int(p.terminationStatus), userInfo: [NSLocalizedDescriptionKey: "No se pudo crear el archivo de Excel."])
              }
          }

          // MARK: - PDF, impresión y portapapeles

          @MainActor
          func exportarPDF<V: View>(_ vista: V, a url: URL) -> Bool {
              let renderer = ImageRenderer(content: vista)
              renderer.proposedSize = ProposedViewSize(width: 700, height: nil)
              var ok = false
              renderer.render { size, dibujar in
                  var caja = CGRect(x: 0, y: 0, width: size.width, height: size.height)
                  guard let ctx = CGContext(url as CFURL, mediaBox: &caja, nil) else { return }
                  ctx.beginPDFPage(nil)
                  dibujar(ctx)
                  ctx.endPDFPage()
                  ctx.closePDF()
                  ok = true
              }
              return ok
          }

          @MainActor
          func imprimirSemana(_ s: Schedule, _ data: AppData) {
              let url = FileManager.default.temporaryDirectory.appendingPathComponent("Acompanamiento-\(UUID().uuidString).pdf")
              if exportarPDF(VistaImprimible(s: s, data: data), a: url) {
                  if let doc = PDFDocument(url: url),
                     let op = doc.printOperation(for: NSPrintInfo.shared, scalingMode: .pageScaleToFit, autoRotate: true) {
                      _ = op.run()
                  } else {
                      NSWorkspace.shared.open(url)
                  }
              }
          }

          func copiarTabla(_ s: Schedule, _ data: AppData) {
              let texto = tablaTexto(s, data).map { $0.joined(separator: "\t") }.joined(separator: "\n")
              let pb = NSPasteboard.general
              pb.clearContents()
              pb.setString(texto, forType: .string)
          }

          @MainActor
          func pedirGuardar(nombre: String, _ accion: (URL) -> Void) {
              let p = NSSavePanel()
              p.nameFieldStringValue = nombre
              p.canCreateDirectories = true
              if p.runModal() == .OK, let u = p.url { accion(u) }
          }

          @MainActor
          func pedirAbrir(_ accion: (URL) -> Void) {
              let p = NSOpenPanel()
              p.canChooseFiles = true
              p.canChooseDirectories = false
              p.allowsMultipleSelection = false
              if p.runModal() == .OK, let u = p.url { accion(u) }
          }

          // MARK: - Vista imprimible (PDF / impresión)

          struct VistaImprimible: View {
              let s: Schedule
              let data: AppData

              var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text(data.settings.institution).font(.system(size: 17, weight: .bold))
                      Text("Sede \(data.settings.sede) · Jornada de la \(s.jornada.lowercased())").font(.system(size: 13))
                      Text("Semana del \(fechaLarga(s.weekStart)) al \(fechaLarga(addDays(s.weekStart, 4)))").font(.system(size: 13, weight: .semibold))
                      ForEach(0..<5, id: \.self) { d in
                          bloque(d)
                      }
                      Text("Observaciones").font(.system(size: 13, weight: .bold)).padding(.top, 6)
                      Text(data.settings.observation).font(.system(size: 12))
                  }
                  .padding(28)
                  .frame(width: 700, alignment: .leading)
                  .background(Color.white)
                  .foregroundColor(.black)
                  .environment(\.colorScheme, .light)
              }

              private func bloque(_ d: Int) -> some View {
                  VStack(alignment: .leading, spacing: 0) {
                      Text("\(diasNombre[d]) \(fechaDia(addDays(s.weekStart, d)))")
                          .font(.system(size: 13, weight: .bold))
                          .padding(6)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .background(Color(red: 0.84, green: 0.89, blue: 0.98))
                      ForEach(s.assignments.filter { $0.day == d }) { a in
                          fila(nombreDocente(a.teacherId, data), a.absent ? "Ausente (sin zona)" : nombreZona(a.zoneId, data), negrita: false)
                      }
                      fila("Ronda general", nombreDocente(s.ronda(d).a, data) + " y " + nombreDocente(s.ronda(d).b, data), negrita: true)
                  }
                  .overlay(Rectangle().stroke(Color.gray.opacity(0.5), lineWidth: 0.7))
              }

              private func fila(_ izq: String, _ der: String, negrita: Bool) -> some View {
                  HStack(alignment: .top) {
                      Text(izq).font(.system(size: 12, weight: negrita ? .bold : .regular)).frame(width: 250, alignment: .leading)
                      Text(der).font(.system(size: 12, weight: negrita ? .bold : .regular)).frame(maxWidth: .infinity, alignment: .leading)
                  }
                  .padding(.horizontal, 6)
                  .padding(.vertical, 3)
              }
          }
