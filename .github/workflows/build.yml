                      AusenciasSheet(id: r.id).environmentObject(store)
                  }
                  .alert("¿Eliminar este docente?", isPresented: Binding(
                      get: { porBorrar != nil },
                      set: { if !$0 { porBorrar = nil } }
                  )) {
                      Button("Eliminar", role: .destructive) {
                          if let r = porBorrar {
                              store.data.teachers.removeAll { $0.id == r.id }
                          }
                          porBorrar = nil
                      }
                      Button("Cancelar", role: .cancel) { porBorrar = nil }
                  } message: {
