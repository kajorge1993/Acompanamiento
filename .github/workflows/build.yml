                                  }
                              }
                          }
                      }
                  }
                  .sheet(item: $detalle) { r in
                      DetalleDocente(id: r.id).environmentObject(store)
                  }
                  .sheet(item: $ausencias) { r in
                      AusenciasSheet(id: r.id).environmentObject(store)
                  }
