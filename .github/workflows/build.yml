          func diaIndice(_ texto: String) -> Int? {
              let t = texto.lowercased()
                  .folding(options: .diacriticInsensitive, locale: nil)
                  .trimmingCharacters(in: .whitespaces)
              switch t {
              case "lunes", "1": return 0
              case "martes", "2": return 1
              case "miercoles", "3": return 2
              case "jueves", "4": return 3
              case "viernes", "5": return 4
              default: return nil
              }
          }

          @MainActor
          struct DocentesView: View {
              @EnvironmentObject var store: Store
              @State private var detalle: IdRef?
              @State private var ausencias: IdRef?
              @State private var porBorrar: IdRef?
              @State private var mensaje: String?

              var body: some View {
                  Pagina("Gestión de docentes") {
                      HStack {
                          Button("Agregar docente") {
                              store.data.teachers.append(Teacher(name: "Nuevo docente", day: 0))
